name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Format check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'The following Go files are not gofmt-formatted:\n%s\n' "$unformatted"
            echo "::warning::Formatting debt remains; qualification continues."
          fi
      - name: Test
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/engo

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Alpine OCI image
        run: docker build -t engo:ci .


  standalone-contract:
    runs-on: ubuntu-latest
    env:
      ENGO_PBMP_SOCKET: ""
      ENGO_BOTWEB_URL: ""
      ENGO_BOTAI_URL: ""
      ENGO_BOTLOGIC_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Qualify standalone core with all integrations disabled
        run: |
          test -z "$ENGO_PBMP_SOCKET"
          test -z "$ENGO_BOTWEB_URL"
          test -z "$ENGO_BOTAI_URL"
          test -z "$ENGO_BOTLOGIC_URL"
          go test ./...
          go build ./cmd/engo
      - name: Verify no Ploos integration is a required Go module
        run: |
          ! go list -m all | grep -Ei 'Ploos-AS/(PBMP|BotWeb|BotAI|BotLogic)'

  pbmp-conformance:
    runs-on: ubuntu-latest
    env:
      PBMP_VERSION: v1.0.0
      ENGO_PBMP_SOCKET: /tmp/engo.pbmp.sock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Start Engo PBMP qualification endpoint
        run: |
          go build -o /tmp/engo-pbmp-qualification ./cmd/engo-pbmp-qualification
          /tmp/engo-pbmp-qualification &
          echo $! > /tmp/engo-pbmp.pid
          for i in {1..50}; do
            test -S "$ENGO_PBMP_SOCKET" && exit 0
            sleep 0.1
          done
          exit 1
      - name: Check out PBMP qualification suite
        uses: actions/checkout@v4
        with:
          repository: Ploos-AS/PBMP
          ref: v1.0.0
          path: .pbmp-suite
      - name: Qualify Engo against PBMP/1
        run: |
          python3 .pbmp-suite/tools/qualify_endpoint.py \
            --socket "$ENGO_PBMP_SOCKET" \
            --implementation-name engo \
            --implementation-version "$GITHUB_SHA" \
            --output engo-pbmp-conformance.json
          python3 -c 'import json; r=json.load(open("engo-pbmp-conformance.json")); assert r["result"] == "pass"'
      - name: Upload PBMP conformance report
        uses: actions/upload-artifact@v4
        with:
          name: engo-pbmp-v1.0.0-conformance
          path: engo-pbmp-conformance.json
          if-no-files-found: error

  botlogic-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Check out BotLogic
        uses: actions/checkout@v4
        with:
          repository: Ploos-AS/BotLogic
          ref: 896fb7ec1e3c63c942ee0e304c0b27edb9313b34
          path: .botlogic
      - name: Build BotLogic
        working-directory: .botlogic
        run: |
          go env GOMOD GOVERSION
          go mod download
          go build -v -o /tmp/botlogic ./cmd/botlogic
      - name: Start BotLogic
        run: |
          mkdir -p /tmp/engo-botlogic-data
          BOTLOGIC_LISTEN=127.0.0.1:18091 BOTLOGIC_DATA_DIR=/tmp/engo-botlogic-data /tmp/botlogic > /tmp/botlogic.log 2>&1 &
          echo $! > /tmp/botlogic.pid
          sleep 1
          cat /tmp/botlogic.log || true
          for i in {1..200}; do
            if curl -fsS http://127.0.0.1:18091/readyz >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/botlogic.pid)" 2>/dev/null; then
              cat /tmp/botlogic.log || true
              exit 1
            fi
            sleep 0.1
          done
          cat /tmp/botlogic.log || true
          exit 1
      - name: Run reference policy acceptance tests
        env:
          ENGO_TEST_BOTLOGIC_URL: http://127.0.0.1:18091
        run: go test ./integration -run TestReferencePolicyAgainstBotLogic -v
